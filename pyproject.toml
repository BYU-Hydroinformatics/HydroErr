[project]
name = "HydroErr"
version = "2.0.0"
description = "Goodness of fit metrics for use in comparison studies, specifically for use in the field of hydrology"
readme = "README.md"
authors = [
    { name = "Wade Roberts", email = "wade.a.roberts@protonmail.com" },
    { name = "Gustavious Williams", email = "gus.williams@byu.edu" },
]
license = {text = "MIT"}
keywords = [
  "hydrology",
  "error",
  "metrics",
  "comparison",
  "statistics",
  "forecast",
  "observed"
]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Hydrology"
]
requires-python = ">=3.10,<=3.15"
dependencies = [
    "numpy~=2.0",
    "scipy~=1.0",
]

[dependency-groups]
dev = [
    "pytest~=9.0",
    "pytest-check~=2.6",
    "pytest-cov~=7.0",
    "ruff~=0.14.0",
    "scipy-stubs>=1.15.3.0",
    "ty>=0.0.1a32",
]
docs = [
    "furo>=2025.9.25",
    "sphinx-automodapi>=0.21.0",
]

[project.urls]
repository = "https://github.com/BYU-Hydroinformatics/HydroErr"

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "HydroErr"

[tool.ruff]
line-length = 100
target-version = "py310" # Set this to the lowest supported version
output-format = "concise"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D211",
    "D213",
    "EM101",
    "EM102",
    "FBT001",
    "FBT002",
    "N813",
    "N999",
    "PLR0913",
    "PLR0915",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",
    "INP",
    "PLR2004",
]
"docs/*" = [
    "A001",
    "ERA001",
    "INP001",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100
