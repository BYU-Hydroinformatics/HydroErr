[project]
name = "HydroErr"
dynamic = ["version"]
description = "Goodness of fit metrics for use in comparison studies, specifically for use in the field of hydrology"
readme = "README.md"
authors = [
    { name = "Wade Roberts", email = "wade.a.roberts@protonmail.com" }
]
license = {text = "MIT"}
keywords = [
  "hydrology",
  "error",
  "metrics",
  "comparison",
  "statistics",
  "forecast",
  "observed"
]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Hydrology"
]
requires-python = ">=3.10,<=3.14"
dependencies = [
    "numpy~=2.0",
    "scipy~=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-check>=2.6.2",
]
docs = [
    "matplotlib>=3.10.7",
]

[project.urls]
repository = "https://github.com/BYU-Hydroinformatics/HydroErr"

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"
